user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;  # don't reveal nginx version

    # ── Gzip ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/json application/javascript application/xml+rss
        application/rss+xml image/svg+xml;

    # ── Rate limiting zones ─────────────────────────────────────
    # General web traffic
    limit_req_zone $binary_remote_addr zone=general:20m  rate=60r/s;
    # API endpoints (auth, score, session)
    limit_req_zone $binary_remote_addr zone=api:20m      rate=20r/s;
    # Auth endpoints — stricter to slow credential-stuffing
    limit_req_zone $binary_remote_addr zone=auth:10m     rate=5r/s;

    # ── Upstream: FastAPI backend ───────────────────────────────
    upstream backend {
        server entropy_backend:8000;
        keepalive 32;
    }

    # ── Helper: common proxy headers ───────────────────────────
    # Defined once and included via map; avoids repetition.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Security headers (applied globally) ────────────────────
    add_header X-Content-Type-Options   nosniff        always;
    add_header X-Frame-Options          SAMEORIGIN     always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ============================================================
    # Primary server — main app + API proxy
    # ============================================================
    server {
        listen 80;
        server_name _;

        # Honour rate limit for everything by default
        limit_req zone=general burst=80 nodelay;

        # ── 1. Health probe (no rate limit, no log) ─────────────
        location = /health {
            access_log off;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 5s;
        }

        # ── 2. Static assets with long cache ────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            root    /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── 3. API proxy — all backend routes under /api/ ───────
        #    The backend itself lives at /, so we strip the /api prefix.
        location /api/ {
            limit_req zone=api burst=30 nodelay;

            rewrite ^/api(/.*)$ $1 break;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── 4. Auth endpoints — tighter rate limit ───────────────
        location ~ ^/(auth|password)/ {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
        }

        # ── 5. Backend-native paths proxied without /api/ prefix ─
        #    Covers /score, /session/, /biometric/, /honeypot/,
        #    /telemetry, /me, /admin/, /webhooks/, /notifications
        location ~ ^/(score|session|biometric|honeypot|telemetry|me|admin|webhooks|notifications) {
            limit_req zone=api burst=30 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── 6. OpenAPI docs ──────────────────────────────────────
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
        }

        # ── 7. SPA catch-all — serves main React app ─────────────
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # ============================================================
    # Shadow / Honeypot server — served at /shadow/ path on the
    # same port via prefix match.  Bots that have been shadow-
    # routed see this frontend; it mirrors the real app visually
    # but sends all requests to the backend's bot-aware endpoints.
    # ============================================================
    server {
        listen 80;
        server_name shadow.localhost;   # use Host header routing in prod

        # Bots don't do rate-limit avoidance — keep same limits
        limit_req zone=general burst=80 nodelay;

        # Shadow static files (identical build, different base URL)
        location / {
            root  /usr/share/nginx/shadow;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Shadow app still proxies /api/ to the same backend
        location /api/ {
            limit_req zone=api burst=30 nodelay;

            rewrite ^/api(/.*)$ $1 break;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Shadow-Mode     "1";   # backend can inspect this
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
        }

        location = /health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
