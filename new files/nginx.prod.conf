user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_referer" rt=$request_time '
                    'ua="$http_user_agent"';

    access_log /var/log/nginx/access.log main buffer=16k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75;
    server_tokens   off;
    client_max_body_size 2m;

    # ── Gzip ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript image/svg+xml;

    # ── Rate limiting ───────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=general:20m  rate=60r/s;
    limit_req_zone $binary_remote_addr zone=api:20m      rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m     rate=5r/s;

    # ── Upstream ─────────────────────────────────────────────
    upstream backend {
        server ep_backend:8000;
        keepalive 64;
    }

    # ── HTTP → HTTPS redirect ───────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ───────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ${SERVER_NAME:-localhost};

        # TLS — mount your cert/key via Docker volume
        ssl_certificate     /etc/ssl/certs/ep_fullchain.pem;
        ssl_certificate_key /etc/ssl/private/ep_privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    nosniff        always;
        add_header X-Frame-Options           SAMEORIGIN     always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        limit_req zone=general burst=80 nodelay;

        # Health (no rate-limit, no log)
        location = /health {
            access_log off;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_read_timeout 5s;
        }

        # Static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            root    /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # API prefix proxy
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # Auth (strict rate limit)
        location ~ ^/(auth|password)/ {
            limit_req zone=auth burst=8 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
        }

        # Backend-native paths
        location ~ ^/(score|session|biometric|honeypot|telemetry|me|admin|webhooks|notifications) {
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        # SPA
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Shadow / Honeypot virtual host ──────────────────────────
    server {
        listen 443 ssl http2;
        server_name shadow.${SERVER_NAME:-localhost};

        ssl_certificate     /etc/ssl/certs/ep_fullchain.pem;
        ssl_certificate_key /etc/ssl/private/ep_privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options    nosniff always;

        limit_req zone=general burst=80 nodelay;

        location / {
            root  /usr/share/nginx/shadow;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Shadow-Mode     "1";
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
        }

        location = /health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
