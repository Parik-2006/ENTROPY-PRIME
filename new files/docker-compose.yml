# ============================================================
#  ENTROPY PRIME — Base Docker Compose
#  Extend with docker-compose.dev.yml or docker-compose.prod.yml
# ============================================================

services:

  # ── MongoDB ────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: ep_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-entropy_prime}
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - ep_internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: ep_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory ${REDIS_MAX_MEM:-256mb}
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ep_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    container_name: ep_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # MongoDB
      MONGODB_URL: "mongodb://${MONGO_APP_USER:-ep_user}:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}@mongodb:27017/${MONGO_DB_NAME:-entropy_prime}?authSource=${MONGO_DB_NAME:-entropy_prime}"
      MONGODB_DB_NAME: ${MONGO_DB_NAME:-entropy_prime}
      # Redis
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      # Secrets — NEVER set defaults for these; they must be in the env file
      EP_SESSION_SECRET: ${EP_SESSION_SECRET:?EP_SESSION_SECRET is required}
      EP_SHADOW_SECRET:  ${EP_SHADOW_SECRET:?EP_SHADOW_SECRET is required}
      EP_API_KEY_SECRET: ${EP_API_KEY_SECRET:?EP_API_KEY_SECRET is required}
      EP_JWT_PUBLIC_KEY_PATH: /app/certs/jwt_public.pem
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend/certs:/app/certs:ro
      - checkpoints:/app/checkpoints:ro
    networks:
      - ep_internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 20s
      timeout: 8s
      retries: 4
      start_period: 30s

  # ── Nginx reverse proxy / frontend server ──────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ep_nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ep_internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
  redis_data:
  checkpoints:

networks:
  ep_internal:
    driver: bridge
