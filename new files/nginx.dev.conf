user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log debug;
pid /var/run/nginx.pid;

events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Relaxed rate limits for dev
    limit_req_zone $binary_remote_addr zone=general:10m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=30r/s;

    upstream backend {
        server ep_backend:8000;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        # In dev, serve frontend from a volume or skip (Vite runs separately)
        root /usr/share/nginx/html;
        index index.html;

        # Health
        location = /health {
            access_log off;
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # API proxy (with /api/ prefix strip)
        location /api/ {
            limit_req zone=api burst=200 nodelay;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        # All other backend paths — no prefix strip
        location ~ ^/(auth|password|score|session|biometric|honeypot|telemetry|me|admin|webhooks|notifications|docs|redoc|openapi\.json) {
            limit_req zone=api burst=200 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
